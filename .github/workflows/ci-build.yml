name: Build & Push Services

on:
  push:
    branches: [ forecast-application-dev ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules with Maven
        run: mvn clean package -DskipTests  # roda na raiz → constrói tudo

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Exemplo para user-service
      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: .               # raiz do repo
          file: ./user_service/Dockerfile
          push: true
          tags: pedrohermes/forecast-application-user_service:latest
          # Opcional: build-args se precisar passar algo