name: CD - Deploy Railway
on:
  workflow_run:
    workflows: ["CI - Build & Push Docker Images"]
    types: [completed]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest  # CLI já instalado
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Railway
        run: railway up --service 89a19eee-d2f8-4a5e-a0f1-d7244d08b57b --environment production --ci --verbose
