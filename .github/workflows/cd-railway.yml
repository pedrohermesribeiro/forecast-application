name: CD - Deploy Railway

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker Images"]
    types: [completed]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Test Railway Auth
        run: railway whoami || echo "Autenticando via token..."

      # MULTI-CONTAINER DOCKER-COMPOSE DEPLOY
      - name: Deploy via docker-compose
        run: railway up \
  --project 20afa6ef-bd8e-4060-a7a8-3e0d5188078b \
  --service ${{ secrets.RAILWAY_SERVICE_ID }} \
  -c docker-compose-prod.yml



