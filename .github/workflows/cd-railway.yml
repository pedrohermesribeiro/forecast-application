name: CD - Deploy Railway

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker Images"]
    types: [completed]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      # LOGIN automático via ENV (sem --token)
      - name: Test Railway Auth
        run: railway whoami || echo "Autenticando via token..."

      - name: Deploy via docker-compose
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} -c docker-compose-prod.yml


      - name: Login Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy docker-compose
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} -c docker-compose-prod.yml
