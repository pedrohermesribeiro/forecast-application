server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: https://user-service-983c.onrender.com
          predicates:
            - Path=/users/**

        - id: role-service
          uri: https://user-service-983c.onrender.com
          predicates:
            - Path=/roles/**

        - id: auth-service
          uri: https://auth-service-komr.onrender.com
          predicates:
            - Path=/auth/login

        - id: ai-service
          uri: https://ai-service-aahv.onrender.com
          predicates:
            - Path=/chat

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
              - http://localhost:3000
              - https://forecast-frontend-gm1d.onrender.com
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
    default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials,Access-Control-Allow-Origin
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000






