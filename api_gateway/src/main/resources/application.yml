server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/users/**

        # Nova rota para roles (pode usar o mesmo serviço)
        - id: role-service
          uri: http://user-service:8083   # mesmo container/porta
          predicates:
            - Path=/roles/**              # ou /roles, /roles/{id}, etc.
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/auth/login

        - id: ai-service
          uri: http://ai-service:8081
          predicates:
            - Path=/ai/chat

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:4200"
              - "http://localhost:8085"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: ["*"]
            allow-credentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway

jwt:
  secret: MeuSegredoSuperSecreto123
