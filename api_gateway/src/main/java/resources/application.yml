server:
  port: 8080  # O Gateway central ficará nessa porta

spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**
        - id: users
          uri: http://localhost:8083
          predicates:
            - Path=/users/**
        - id: ai
          uri: http://localhost:8081
          predicates:
            - Path=/ai/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
