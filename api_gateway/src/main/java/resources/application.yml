server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth_service:8080
          predicates:
            - Path=/auth/**
        - id: users
          uri: http://user_service:8080
          predicates:
            - Path=/users/**
        - id: ai
          uri: http://ai_service:8080
          predicates:
            - Path=/ai/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:8085"
              - "https://forecast-app-dev-bjhxh3fjceeud7cv.brazilsouth-01.azurewebsites.net"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
