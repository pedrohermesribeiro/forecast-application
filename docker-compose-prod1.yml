version: "3.9"

services:
  frontend:
      image: pedrohermes/forecast-application-frontend:latest
      restart: always
      ports:
        - "8085:80"

  api_gateway:
    image: pedrohermes/forecast-application-api_gateway:latest
    restart: always
    ports:
      - "8080:8080"

  auth_service:
    image: pedrohermes/forecast-application-auth_service:latest
    restart: always
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  user_service:
    image: pedrohermes/forecast-application-user_service:latest
    restart: always
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  ai_service:
    image: pedrohermes/forecast-application-ai_service:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${URL}

