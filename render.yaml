services:
  # Frontend (Nginx estático após build Angular/React/Vue)
  - type: web
    name: frontend
    runtime: docker
    plan: free                # ← mude para starter se precisar de mais recursos
    rootDir: forecast-frontend
    # dockerfilePath: ./Dockerfile   # opcional se for Dockerfile na raiz da pasta
    envVars:
      - key: SPRING_PROFILES_ACTIVE   # se o frontend precisar (provavelmente não)
        value: prod
    # domains:                         # descomente se quiser domínio custom
    #   - seu-dominio.com

  # API Gateway (ponto de entrada público)
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    rootDir: api_gateway
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Adicione outras se necessário, ex: URLs internas dos serviços
      # - key: USER_SERVICE_URL
      #   value: http://user-service:8083   # Render resolve internamente pelo name
    # domains:                           # adicione se quiser domínio custom
    #   - api.seu-dominio.com

  # Auth Service (interno)
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    rootDir: auth_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false               # ← preencha no dashboard do Render (segredo)

  # User Service (interno)
  # Bancos Postgres foram criados manualmente no dashboard (fora do Blueprint),
  # por isso as 5 vars DB_* sao sync:false e preenchidas no dashboard.
  - type: web
    name: user-service
    runtime: docker
    plan: free
    rootDir: user_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false               # ← mesmo valor do auth-service (necessário p/ filtro JWT)
      - key: DB_HOST
        sync: false               # ← internal hostname do forecast-user-db
      - key: DB_PORT
        sync: false               # ← 5432
      - key: DB_NAME
        sync: false               # ← forecast_user_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false

  # AI Service (interno, com chaves de API)
  - type: web
    name: ai-service
    runtime: docker
    plan: free
    rootDir: ai_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OPENAI_API_KEY
        sync: false               # ← segredo, preencha no dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JAVA_OPTS
        value: -Xmx512m
      - key: JWT_SECRET
        sync: false               # ← mesmo valor do auth-service
      - key: DB_HOST
        sync: false               # ← internal hostname do forecast-ai-db
      - key: DB_PORT
        sync: false               # ← 5432
      - key: DB_NAME
        sync: false               # ← forecast_ai_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # - key: GEMINI_API_KEY      # descomente se usar Gemini
      #   sync: false

# Bancos Postgres foram criados manualmente no dashboard (fora do escopo do
# Blueprint). Por isso o bloco `databases:` nao aparece aqui — declara-los
# faria o Render tentar criar duplicatas. Os valores de conexao sao injetados
# via env vars sync:false em user-service e ai-service.
