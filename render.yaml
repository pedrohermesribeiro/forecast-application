services:
  # Frontend (Nginx estático após build Angular/React/Vue)
  - type: web
    name: frontend
    runtime: docker
    plan: free                # ← mude para starter se precisar de mais recursos
    rootDir: forecast-frontend
    # dockerfilePath: ./Dockerfile   # opcional se for Dockerfile na raiz da pasta
    envVars:
      - key: SPRING_PROFILES_ACTIVE   # se o frontend precisar (provavelmente não)
        value: prod
    # domains:                         # descomente se quiser domínio custom
    #   - seu-dominio.com

  # API Gateway (ponto de entrada público)
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    rootDir: api_gateway
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Adicione outras se necessário, ex: URLs internas dos serviços
      # - key: USER_SERVICE_URL
      #   value: http://user-service:8083   # Render resolve internamente pelo name
    # domains:                           # adicione se quiser domínio custom
    #   - api.seu-dominio.com

  # Auth Service (interno)
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    rootDir: auth_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false               # ← preencha no dashboard do Render (segredo)

  # User Service (interno)
  - type: web
    name: user-service
    runtime: docker
    plan: free
    rootDir: user_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false               # ← mesmo valor do auth-service (necessário p/ filtro JWT)
      - key: DB_HOST
        fromDatabase:
          name: forecast-user-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: forecast-user-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: forecast-user-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: forecast-user-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: forecast-user-db
          property: password

  # AI Service (interno, com chaves de API)
  - type: web
    name: ai-service
    runtime: docker
    plan: free
    rootDir: ai_service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OPENAI_API_KEY
        sync: false               # ← segredo, preencha no dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JAVA_OPTS
        value: -Xmx512m
      - key: JWT_SECRET
        sync: false               # ← mesmo valor do auth-service
      - key: DB_HOST
        fromDatabase:
          name: forecast-ai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: forecast-ai-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: forecast-ai-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: forecast-ai-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: forecast-ai-db
          property: password
      # - key: GEMINI_API_KEY      # descomente se usar Gemini
      #   sync: false

# Bancos Postgres (Oregon) — migração de H2 in-memory para persistência real (TCC)
# Atenção: o Render free tier permite apenas 1 Postgres free por conta. O segundo
# banco aqui está em plano "starter" (pago). Ajuste no dashboard se necessário.
databases:
  - name: forecast-user-db
    plan: free
    region: oregon
    databaseName: forecast_user_db
    user: forecast_user
  - name: forecast-ai-db
    plan: starter
    region: oregon
    databaseName: forecast_ai_db
    user: forecast_ai
