services:
  api_gateway:
    build: ./api_gateway
    ports:
      - "8080:8080"
    networks:
      - app-network
  frontend:
    build: ./forecast-frontend
    ports:
      - "8085:80"
    networks:
      - app-network
  auth_service:
    build: ./auth_service
    ports:
      - "8082:8080"
    networks:
      - app-network
  user_service:
    build: ./user_service
    ports:
      - "8083:8080"
    networks:
      - app-network
  ai_service:
    build: ./ai_service
    ports:
      - "8081:8080"
    env_file:
      - .env
    networks:
      - app-network
    environment:
      GEMINI_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
networks:
  app-network:
    driver: bridge