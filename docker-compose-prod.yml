version: "3.9"

services:
  frontend:
    image: pedrohermes/forecast-application-frontend:latest
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8085:80"

  api-gateway:
    image: pedrohermes/forecast-application-api-gateway:latest
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"

  auth-service:
    image: pedrohermes/forecast-application-auth-service:latest
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8080"

  user-service:
    image: pedrohermes/forecast-application-user-service:latest
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8083:8080"

    role-service:
      image: pedrohermes/forecast-application-user-service:latest
      restart: always
      environment:
        SPRING_PROFILES_ACTIVE: prod
      ports:
        - "8083:8080"

  ai-service:
    image: pedrohermes/forecast-application-ai-service:latest
    restart: always
    ports:
      - "8081:8080"
    environment:                  # ← aqui sim, environment é válido
          - OPENAI_API_KEY=${OPENAI_API_KEY}
          - OPENAI_MODEL=gpt-4o-mini
          - JAVA_OPTS=-Xmx512m
    # restart: unless-stopped

