version: "3.9"

services:
  frontend:
    image: pedrohermes/forecast-application-frontend:latest
    ports:
      - "8085:80"

  api_gateway:
    image: pedrohermes/forecast-application-api_gateway:latest
    ports:
      - "8080:8080"

  auth_service:
    image: pedrohermes/forecast-application-auth_service:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8082:8080"

  user_service:
    image: pedrohermes/forecast-application-user_service:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8083:8080"

  ai_service:
    image: pedrohermes/forecast-application-ai_service:latest
    ports:
      - "8081:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}


      - "8081:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
    restart: always
