trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOCKER_REPO: 'pedrohermes'            # seu DockerHub user/org
  WEBAPP_NAME: 'forecast-app-dev'       # nome do App Service
  RESOURCE_GROUP: 'forecast-rg'         # resource group do Azure
  AZURE_SUBSCRIPTION: 'AzureConnection' # service connection configurada no DevOps

stages:
  - stage: Build
    displayName: "Build e Push Docker Images"
    jobs:
      - job: BuildJob
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: "Configurar JDK 21"

          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package -DskipTests'
            displayName: "Build com Maven"

          # Build e push api_gateway
          - task: Docker@2
            displayName: "Build & Push api_gateway"
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: '$(DOCKER_REPO)/forecast-application-api_gateway'
              command: 'buildAndPush'
              Dockerfile: 'api_gateway/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          # Build e push auth_service
          - task: Docker@2
            displayName: "Build & Push auth_service"
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: '$(DOCKER_REPO)/forecast-application-auth_service'
              command: 'buildAndPush'
              Dockerfile: 'auth_service/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          # Build e push user_service
          - task: Docker@2
            displayName: "Build & Push user_service"
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: '$(DOCKER_REPO)/forecast-application-user_service'
              command: 'buildAndPush'
              Dockerfile: 'user_service/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          # Build e push ai_service
          - task: Docker@2
            displayName: "Build & Push ai_service"
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: '$(DOCKER_REPO)/forecast-application-ai_service'
              command: 'buildAndPush'
              Dockerfile: 'ai_service/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          # Build e push frontend
          - task: Docker@2
            displayName: "Build & Push frontend"
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: '$(DOCKER_REPO)/forecast-application-frontend'
              command: 'buildAndPush'
              Dockerfile: 'frontend/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: "Deploy no Azure Web App (multi-container)"
    dependsOn: Build
    jobs:
      - job: DeployJob
        steps:
          - task: AzureWebAppContainer@1
            displayName: "Deploy docker-compose-prod.yml"
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              appName: '$(WEBAPP_NAME)'
              resourceGroupName: '$(RESOURCE_GROUP)'
              multicontainerConfigFile: 'docker-compose-prod.yml'
