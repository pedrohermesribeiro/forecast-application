server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /ai/ {
        proxy_pass http://api_gateway:8080/;
    }

    location /auth/ {
        proxy_pass http://auth_service:8080/;
    }

    location /users/ {
        proxy_pass http://user_service:8080/;
    }
}
