<div class="container">
  <h2>Roles</h2>

  <button class="btn btn-primary" (click)="novaRole()">➕ Nova Role</button>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Role</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let role of roles">
        <td>{{ role.id }}</td>
        <td>{{ role.name }}</td>
        <td>
          <button class="btn-edit" (click)="editarRoles(role.id)">Editar</button>
          <button class="btn-delete" (click)="deletarRoles(role.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
