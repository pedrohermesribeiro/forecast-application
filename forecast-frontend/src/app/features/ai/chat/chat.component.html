<div class="chat-layout">
  <!-- Sidebar com gráficos (à direita no desktop, acima no mobile) -->
  <aside class="sidebar" [ngClass]="{ 'sidebar-open': sidebarOpen }">
    <div class="sidebar-header">
      <h3>Previsões / Gráficos</h3>
      <button class="close-btn" (click)="toggleSidebar()" *ngIf="isMobile">Fechar</button>
    </div>
    
    <!-- Componente de previsão -->
    <app-prediction
      *ngIf="showPrediction"
      [previsaoData]="previsao">
      <!-- Seu debug -->
      <div style="color: red; font-weight: bold; margin: 10px;">
        DEBUG: Previsão com {{ previsao?.length || 0 }} itens
      </div>
    </app-prediction>

    <!-- Se não tiver previsão ainda, placeholder -->
    <div *ngIf="!showPrediction" class="no-data">
      <p>Aguardando previsão...</p>
    </div>
  </aside>

  <!-- Área principal do chat -->
  <main class="chat-main">
    <h2>Chatbot de Previsão</h2>

    <div class="chat-input">
      <input
        type="text"
        [(ngModel)]="newMessage"
        name="message"
        placeholder="Digite sua pergunta..."
        (keyup.enter)="sendMessage()"
      />
      <button (click)="sendMessage()">Enviar</button>
    </div>

    <div class="messages" *ngIf="message.length > 0">
      <div *ngFor="let msg of message" 
           class="message-item" 
           [ngClass]="{'user-message': msg.sender === 'user', 'bot-message': msg.sender === 'bot'}">
        <strong>{{ msg.sender === 'user' ? 'Você:' : 'Bot:' }}</strong>
        <div class="message-text">
          {{ msg.text }}
        </div>
      </div>
    </div>

    <div class="chat-actions" *ngIf="message.length > 0">
      <button (click)="novaPergunta()">Nova pergunta</button>
    </div>

    <!-- Botão para abrir sidebar no mobile -->
    <button class="sidebar-toggle" (click)="toggleSidebar()" *ngIf="isMobile && !sidebarOpen">
      Ver Gráficos
    </button>
  </main>
</div>
